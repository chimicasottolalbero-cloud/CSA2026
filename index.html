<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Chimica sotto l'Albero 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CSA 2026">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --blu:#2B2D55; --azzurro:#E7F3FA; --rosso:#A23F30; --rosato:#F6ECE9;
    --grigio:#9A9AA0; --linea:#E2E2E6; --testo:#2B2B2B;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
  body{margin:0;background:#fff;color:var(--testo);
    font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}

  /* intestazione come gli altri riquadri del sito */
  header.top{padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 4px}
  header.top h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:23px;font-weight:600;color:var(--blu)}
  header.top p{margin:0;font-size:14px;color:var(--rosso);font-weight:600}
  .stato{font-size:12px;color:var(--grigio);margin-top:2px}

  .avviso{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--rosato);color:var(--rosso);font-size:14px}

  /* pannello "ora in corso" */
  .live{margin-top:12px}
  .live h2{margin:0 0 6px;font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--rosso);
    display:flex;align-items:center;gap:8px}
  .live h2 .punto{width:8px;height:8px;border-radius:50%;background:var(--rosso);animation:pulsa 1.6s infinite}
  @keyframes pulsa{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.live h2 .punto{animation:none}}
  .live small.prog{font-family:"Open Sans",system-ui,sans-serif;font-size:12px;font-weight:400;color:var(--grigio);margin-left:auto}
  .carte{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
  .carta{border-radius:10px;padding:10px 12px;background:var(--rosato)}
  .carta:nth-child(2){background:var(--azzurro)}
  .carta .sala{font-size:12.5px;font-weight:600;color:#66666c;display:flex;justify-content:space-between;gap:6px}
  .carta .rit{color:var(--rosso)}
  .carta .ora-tit{margin-top:3px;font-family:"Playfair Display",Georgia,serif;font-size:16px;font-weight:600;color:var(--blu);line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .carta .chi{font-size:13.5px;margin-top:2px}
  .carta .poi{margin-top:6px;font-size:12.5px;color:#66666c}
  .carta .poi b{color:var(--testo)}
  .carta.vuota .ora-tit{font-family:"Open Sans",system-ui,sans-serif;font-size:14px;font-weight:400;color:#66666c}

  /* barra fissa: giorni come i tasti delle quote, sale come etichette */
  .barra{position:sticky;top:0;z-index:5;background:#fff;padding:10px 0 8px;margin-top:12px;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);border-bottom:1px solid var(--linea)}
  .schede{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .schede button{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:7px 4px;font:inherit;font-size:15px;
    font-weight:600;color:var(--testo);cursor:pointer}
  .schede button.on{background:var(--rosso);border-color:var(--rosso);color:#fff}
  .filtri{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .filtri::-webkit-scrollbar{display:none}
  .filtri button{flex:none;border:0;background:var(--azzurro);border-radius:12px;padding:4px 12px;font:inherit;font-size:13px;color:var(--blu);cursor:pointer}
  .filtri button.on{background:var(--blu);color:#fff}
  .cerca{margin-top:8px;position:relative}
  .cerca input{width:100%;border:1px solid var(--linea);border-radius:6px;padding:7px 32px 7px 10px;font:inherit;font-size:16px;background:#fff}
  .cerca button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;color:var(--grigio);cursor:pointer;padding:4px 8px}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:1px}

  /* elenco, nello stile delle righe delle quote */
  main{padding:6px 0 30px}
  .blocco{margin-top:14px}
  .intest{padding:0 0 4px;border-bottom:2px solid var(--blu)}
  .intest.s1{border-bottom-color:var(--rosso)}
  .intest .nome{font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--blu)}
  .intest .dett{font-size:12.5px;color:#66666c}
  .intest .dett b{font-weight:600;color:var(--blu)}
  .intest.s1 .dett b{color:var(--rosso)}
  .voce{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
  .gruppo .voce:first-child{border-top:0}
  .ora{flex:none;width:44px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blu)}
  .ora s{display:block;font-weight:400;font-size:11.5px;color:var(--grigio)}
  .corpo{min-width:0;flex:1}
  .tit{font-weight:600;line-height:1.3}
  .rel{font-size:13.5px;margin-top:2px}
  .rel b{font-weight:600}
  .aff{color:#66666c}
  .nota{font-size:12.5px;color:#66666c;margin-top:3px}
  .tag{font-family:"Open Sans",system-ui,sans-serif;display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;margin-right:6px;vertical-align:1px;white-space:nowrap}
  .t-OR{background:var(--azzurro);color:var(--blu)}
  .t-FL{background:var(--rosato);color:var(--rosso)}
  .t-PL,.t-GS{background:var(--rosso);color:#fff}
  .t-SP{background:var(--azzurro);color:var(--blu)}
  .t-P{background:var(--rosato);color:var(--rosso)}
  .comune .voce{border-top:0}
  .comune.pausa{border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
  .comune.pausa .tit{font-weight:400;color:#66666c;font-style:italic}
  .comune.speciale{background:var(--rosato);border-radius:10px;padding:0 12px}
  .comune.speciale .tit{font-family:"Playfair Display",Georgia,serif;font-size:16.5px;color:var(--blu)}
  .voce.passata{opacity:.45}
  .voce.incorso{background:var(--rosato);border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
  .voce.incorso .ora{color:var(--rosso)}
  .badge{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--rosso);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .vuoto{padding:30px 10px;text-align:center;color:#66666c}
  .sessp h3{margin:16px 0 4px;font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--blu);
    padding-bottom:4px;border-bottom:2px solid var(--blu)}
  .risultati-tit{font-size:13px;color:#66666c;margin:10px 0 4px}
  .quando{font-size:12px;color:var(--rosso);font-weight:600;margin-bottom:1px}
  footer{font-size:12px;color:var(--grigio);text-align:center;padding:10px 0 24px}
  /* ===== app ===== */
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
  header.top{display:flex;align-items:center;gap:12px}
  header.top img{height:46px;width:auto}
  header.top .testi{min-width:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--linea);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .nav button{border:0;background:none;padding:7px 2px 6px;font:inherit;font-size:11.5px;color:#66666c;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button svg{width:22px;height:22px}
  .nav button.on{color:var(--rosso);font-weight:600}
  .nav .conta{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--rosso);
    color:#fff;font-size:10px;line-height:16px;padding:0 4px}
  .nav button{position:relative}

  .stella{flex:none;align-self:flex-start;border:0;background:none;padding:2px 0 4px 4px;cursor:pointer;color:#C9C9CE}
  .stella svg{width:22px;height:22px;display:block}
  .stella.on{color:var(--rosso)}
  .stella.on svg path{fill:currentColor}

  .titolo-vista{margin:16px 0 2px;font-family:"Playfair Display",Georgia,serif;font-size:22px;font-weight:600;color:var(--blu)}
  .sotto-vista{margin:0 0 6px;font-size:13.5px;color:#66666c}
  .giorno-mio{margin:14px 0 2px;font-weight:600;color:var(--rosso)}
  .conflitto{font-size:12px;color:var(--rosso);font-weight:600;margin-top:2px}

  .info-voce{padding:12px 0;border-top:1px solid var(--linea)}
  .info-voce h3{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--blu)}
  .info-voce p{margin:3px 0 0;white-space:pre-line}
  .info-voce a.link{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:4px;background:var(--rosso);color:#fff;
    text-decoration:none;font-weight:600;font-size:14px}

  .installa{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--azzurro);display:flex;gap:10px;align-items:center}
  .installa p{margin:0;font-size:13.5px;flex:1;color:var(--blu)}
  .installa button{border:0;border-radius:4px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .installa .si{background:var(--rosso);color:#fff}
  .installa .no{background:none;color:#66666c;padding:7px 4px}
  .pdf{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--rosso);text-decoration:none}
  .pdf::before{content:"";width:14px;height:14px;background:currentColor;
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>') center/contain no-repeat;
    mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>') center/contain no-repeat}
  .chiedi{margin-top:6px;border:1.5px solid var(--rosso);background:#fff;color:var(--rosso);border-radius:14px;padding:3px 12px;
    font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  dialog{border:0;border-radius:12px;padding:0;width:min(92vw,480px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(43,45,85,.35)}
  .dlg{padding:16px}
  .dlg h3{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:19px;color:var(--blu)}
  .dlg-sotto{margin:2px 0 10px;font-size:13px;color:#66666c}
  .dlg label{display:block;font-size:13px;font-weight:600;margin-top:8px}
  .dlg label span{font-weight:400;color:var(--grigio)}
  .dlg textarea,.dlg input{display:block;width:100%;margin-top:3px;border:1px solid var(--linea);border-radius:6px;padding:8px;font:inherit;font-size:16px;font-weight:400}
  .dlg-nota{font-size:12.5px;color:#66666c;margin:10px 0 0}
  .esito{font-size:13px;color:var(--rosso);margin:6px 0 0;min-height:1em}
  .dlg-az{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
  .dlg-az button{border:0;border-radius:4px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer}
  .dlg-az .ok{background:var(--rosso);color:#fff}
  .dlg-az .annulla{background:none;color:#66666c}
  .senior{padding:12px 0;border-top:1px solid var(--linea)}
  .nome-s{font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--blu)}
  .ruolo-s{font-size:13.5px}
  .luogo-s{font-size:12.5px;color:#66666c}
  .fasce{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .fascia{border:1.5px solid var(--rosso);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer;text-align:left;color:var(--testo)}
  .fascia b{display:block;font-size:13px}
  .fascia small{font-size:12px;color:var(--rosso);font-weight:600}
  .fascia.pieno{border-color:var(--linea);background:#F4F4F5;cursor:default}
  .fascia.pieno small{color:var(--grigio)}
  .fascia.mio{border-color:var(--rosso);background:var(--rosso);color:#fff;cursor:default}
  .fascia.mio small{color:#fff}
  .filtri.opp{margin:4px 0 6px}
  .opp-voce{padding:12px 0;border-top:1px solid var(--linea)}
  .opp-tit{font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--blu);margin-top:4px}
  .opp-voce p{margin:4px 0 0;font-size:14px}
  .opp-voce a.link{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:4px;background:var(--rosso);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
  body.chair .nav,body.chair #live,body.chair .barra,body.chair #pdf,body.chair #installa{display:none!important}
  body.chair{padding-bottom:20px}
  .accesso{max-width:360px}
  .accesso label{display:block;font-size:13px;font-weight:600;margin-top:10px}
  .accesso input{display:block;width:100%;margin-top:3px;border:1px solid var(--linea);border-radius:6px;padding:8px;font:inherit;font-size:16px;font-weight:400}
  .acc-ok{margin-top:10px;border:0;border-radius:4px;background:var(--rosso);color:#fff;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer}
  .chair-testa{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .chair-testa span{font-size:13px;color:#66666c}
  .esci{border:0;background:none;color:var(--rosso);font:inherit;font-weight:600;cursor:pointer;padding:0}
  .chair-schede{margin:6px 0 8px}
  .p-filtri{margin:0 0 6px}
  .p-sess{margin:14px 0 2px;font-weight:600;color:var(--blu);font-size:13.5px;padding-bottom:3px;border-bottom:2px solid var(--blu)}
  .p-riga{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);background:#fff;
    padding:9px 0;font:inherit;cursor:pointer;color:var(--testo)}
  .p-riga.aperto{background:var(--azzurro);margin:0 -8px;padding:9px 8px;width:calc(100% + 16px);border-radius:8px 8px 0 0}
  .p-ora{flex:none;width:44px;font-weight:600;color:var(--blu)}
  .p-chi{flex:1;min-width:0}
  .p-chi b{font-weight:600}
  .p-chi small{display:block;font-size:12.5px;color:#66666c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .p-stato{flex:none;font-size:12.5px;color:#66666c;text-align:right}
  .p-stato b{font-size:16px;color:var(--rosso)}
  .p-riga.fatto .p-chi,.p-riga.fatto .p-ora{opacity:.6}
  .p-editor{background:var(--azzurro);margin:0 -8px 8px;padding:4px 8px 10px;border-radius:0 0 8px 8px}
  .p-crit{margin-top:8px}
  .p-crit-nome{font-size:13px;font-weight:600;color:var(--blu)}
  .p-scala{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:4px}
  .p-scala button{border:1px solid var(--linea);background:#fff;border-radius:5px;padding:7px 0;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--testo)}
  .p-scala button.on{background:var(--rosso);border-color:var(--rosso);color:#fff}
  .p-note{display:block;margin-top:10px;font-size:13px;font-weight:600}
  .p-note span{font-weight:400;color:#66666c}
  .p-note textarea{display:block;width:100%;margin-top:3px;border:1px solid var(--linea);border-radius:6px;padding:7px;font:inherit;font-size:16px;font-weight:400}
  .p-invio{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .p-invio b{font-size:20px;color:var(--rosso)}
  .p-manda{border:0;border-radius:4px;background:var(--rosso);color:#fff;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  .p-manda:disabled{background:var(--grigio);cursor:default}
  body.chair footer{display:none}
  .chair-sel{display:block;margin-top:10px;font-size:13px;font-weight:600}
  .chair-sel select{display:block;width:100%;margin-top:3px;padding:8px;border:1px solid var(--linea);border-radius:6px;font:inherit;font-size:16px;background:#fff}
  .chair-int{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--azzurro)}
  .chair-stato{margin:12px 0 4px;font-size:13px;color:#66666c}
  .domanda{padding:12px;border-radius:10px;background:var(--rosato);margin-top:8px;position:relative}
  .domanda.fatta{background:#F4F4F5;opacity:.6}
  .d-testo{font-size:18px;line-height:1.35;padding-right:70px}
  .d-dett{font-size:12.5px;color:#66666c;margin-top:4px}
  .d-fatta{position:absolute;right:10px;top:10px;border:1.5px solid var(--rosso);background:#fff;color:var(--rosso);border-radius:14px;
    padding:3px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .partecipa{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--azzurro)}
  .partecipa.voto{background:var(--rosato)}
  .p-tit{font-size:12px;font-weight:600;color:#66666c;text-transform:uppercase;letter-spacing:.4px}
  .p-dom{font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--blu);margin-top:2px}
  .p-form{display:flex;gap:6px;margin-top:8px}
  .p-form input{flex:1;min-width:0;border:1px solid var(--linea);border-radius:6px;padding:7px 10px;font:inherit;font-size:16px}
  .p-form button,.p-vota{border:0;border-radius:4px;background:var(--rosso);color:#fff;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
  .p-vota{margin-top:8px}
  .p-ok{margin:6px 0 0;font-size:13.5px;color:var(--rosso);font-weight:600}
  .cal{margin-top:6px;border:1.5px solid var(--rosso);background:#fff;color:var(--rosso);border-radius:6px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .cal-nota{margin:4px 0 0;font-size:12px;color:#66666c}
  .cerca-voto{width:100%;margin:6px 0;border:1px solid var(--linea);border-radius:6px;padding:7px 10px;font:inherit;font-size:16px}
  .candidati{display:grid;gap:6px}
  .cand{display:block;text-align:left;border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer;color:var(--testo)}
  .cand b{font-weight:600}
  .cand small{display:block;font-size:12.5px;color:#66666c;margin-top:2px}
  .cand.on{border-color:var(--rosso);background:var(--rosato)}
  body.schermo .nav,body.schermo #live,body.schermo .barra,body.schermo #pdf,body.schermo #installa,body.schermo #pubblico,
  body.schermo footer,body.schermo header.top .stato{display:none!important}
  body.schermo{padding-bottom:10px}
  body.schermo .wrap{max-width:1200px}
  .nv-dom{margin:10px 0 0;text-align:center;font-family:"Playfair Display",Georgia,serif;font-size:clamp(24px,4vw,46px);color:var(--blu)}
  .nv-cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 22px;min-height:55vh;padding:20px 0}
  .nv-w{font-weight:700;line-height:1.05;transition:font-size .6s ease;cursor:pointer}
  .nv-vuota{font-size:22px;color:var(--grigio)}
  .nv-piede{text-align:center;font-size:16px;color:#66666c}
  .ris{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}

/* date e orari sempre in ora italiana */
function offsetRoma(t){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Rome",hourCycle:"h23",
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
    .formatToParts(new Date(t)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, p.month-1, +p.day, +p.hour, +p.minute, +p.second) - t;
}
function roma(g, o){
  const [Y,M,D] = g.split("-").map(Number), [h,m] = o.split(":").map(Number);
  const t = Date.UTC(Y, M-1, D, h, m);
  return t - offsetRoma(t);
}
function romaDaIso(s){ const [g,o="00:00"] = s.split("T"); return roma(g, o.slice(0,5)); }
function giornoRoma(t){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t));
}
function hhmm(t){
  return new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",hour:"2-digit",minute:"2-digit"}).format(new Date(t));
}
function etichettaGiorno(g, lunga){
  const f = new Intl.DateTimeFormat("it-IT", lunga ? {timeZone:"Europe/Rome",weekday:"long",day:"numeric",month:"long"}
                                                  : {timeZone:"Europe/Rome",weekday:"short",day:"numeric",month:"short"});
  const s = f.format(new Date(roma(g, "12:00"))).replace(".", "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* valori scritti nel foglio */
function normGiorno(v){
  v = String(v || "").trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
function normOra(v){
  const m = String(v || "").trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${m[1].padStart(2,"0")}:${m[2]}` : "";
}

/* lettura dal foglio Google */
function csv(testo){
  const righe = []; let riga = [], campo = "", q = false;
  for (let i = 0; i < testo.length; i++){
    const c = testo[i];
    if (q){ if (c === '"'){ if (testo[i+1] === '"'){ campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === ","){ riga.push(campo); campo = ""; }
    else if (c === "\n"){ riga.push(campo); righe.push(riga); riga = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo || riga.length){ riga.push(campo); righe.push(riga); }
  const [h, ...r] = righe;
  return r.map(x => Object.fromEntries(h.map((k,i) => [k.trim(), (x[i] ?? "").trim()])));
}
async function scheda(nome, facoltativa){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(nome)}&t=${Date.now()}`;
  try {
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    return csv(await r.text());
  } catch(e){ if (facoltativa) return []; throw e; }
}

function prepara(g){
  const items = (g.Programma || []).map(r => ({
    g: normGiorno(r["Giorno"]), ora: normOra(r["Ora"]), fine: normOra(r["Fine"]),
    sala: (r["Sala"] || "Tutte").trim() || "Tutte", sessione: r["Sessione"] || "", chair: r["Chair"] || "",
    codice: (r["Codice"] || "").trim(), titolo: r["Titolo"] || "", relatore: r["Relatore"] || "",
    aff: r["Affiliazione"] || "", note: r["Note"] || ""
  })).filter(x => x.g && x.ora && x.titolo);
  items.forEach(x => {
    x.tipo = (x.codice.match(/^[A-Za-z]+/) || [""])[0].toUpperCase();
    x.comune = x.sala.toLowerCase() === "tutte";
    x.base = roma(x.g, x.ora);
  });
  const sale = [...new Set(items.filter(x => !x.comune).map(x => x.sala))];
  const ritardi = {}; let avviso = "";
  (g.Live || []).forEach(r => {
    const s = (r["Sala"] || "").trim(), v = parseInt(r["Ritardo (minuti)"], 10);
    if (s) ritardi[s.toLowerCase()] = isNaN(v) ? 0 : v;
    if ((r["Avviso"] || "").trim()) avviso = r["Avviso"].trim();
  });
  const poster = (g.Poster || []).map(r => ({codice:(r["Codice"]||"").trim(), sess:String(r["Sessione poster"]||"").trim(),
    titolo:r["Titolo"]||"", autore:r["Autore"]||"", aff:r["Affiliazione"]||""})).filter(p => p.codice || p.titolo);
  const info = (g.Info || []).map(r => ({voce:r["Voce"]||"", testo:r["Testo"]||"", link:r["Link"]||"", etichetta:r["Testo del pulsante"]||""}))
    .filter(x => x.voce || x.testo);
  const giorni = [...new Set(items.map(x => x.g))].sort();
  const slot = (g.Caffe || []).map(r => ({senior:(r["Senior"]||"").trim(), ruolo:r["Ruolo"]||"", g:normGiorno(r["Giorno"]),
    ora:normOra(r["Ora"]), posti:parseInt(r["Posti"], 10) || 1, luogo:r["Luogo"]||"", note:r["Note"]||""}))
    .filter(x => x.senior && x.g && x.ora);
  slot.forEach(x => { x.id = `${x.senior} · ${x.g} ${x.ora}`; x.base = roma(x.g, x.ora); });
  const occupati = {};
  (g.Conteggi || []).forEach(r => { const v = Object.values(r); if (v[0]) occupati[v[0].trim()] = parseInt(v[1], 10) || 0; });
  const opportunita = (g.Opportunita || []).map(r => ({titolo:r["Titolo"]||"", ente:r["Ente"]||"", tipo:(r["Tipo"]||"").trim(),
    sede:r["Sede"]||"", scadenza:normGiorno(r["Scadenza"]), link:r["Link"]||"", desc:r["Descrizione"]||""})).filter(x => x.titolo);
  const siNo = v => /^(s[iì]|x|1|true|vero)$/i.test(String(v || "").trim());
  const nuvola = (g.Nuvola || []).map(r => ({domanda:(r["Domanda"]||"").trim(), attiva:siNo(r["Attiva"])})).filter(x => x.domanda);
  const quando = v => { const m = String(v || "").trim().match(/^(\S+)\s+(\d{1,2}[:.]\d{2})/); return m && normGiorno(m[1]) ? roma(normGiorno(m[1]), normOra(m[2])) : null; };
  const voto = (g.Voto || []).map(r => ({categoria:(r["Categoria"]||"").trim(), tipi:(r["Tipi"]||"").toUpperCase().split(/[\s,;]+/).filter(Boolean),
    apre:quando(r["Apertura"]), chiude:quando(r["Chiusura"])})).filter(x => x.categoria && x.tipi.length);
  return {items, sale, ritardi, avviso, poster, info, giorni, slot, occupati, opportunita, nuvola, voto};
}

/* orari effettivi, con i ritardi applicati solo al giorno in corso */
function calcola(){
  const oggi = giornoRoma(adesso());
  const {items, ritardi} = dati;
  items.forEach(x => {
    x.rit = x.g === oggi ? (ritardi[x.sala.toLowerCase()] || 0) : 0;
    x.inizio = x.base + x.rit * MIN;
  });
  items.forEach(x => {
    const dopo = items.filter(y => y.g === x.g && y.base > x.base && (x.comune || y.comune || y.sala === x.sala)).map(y => y.inizio);
    const prossimo = dopo.length ? Math.min(...dopo) : null;
    if (x.fine) x.termine = roma(x.g, x.fine) + x.rit * MIN;
    else if (DURATA[x.tipo]) x.termine = Math.min(x.inizio + DURATA[x.tipo] * MIN, prossimo ?? Infinity);
    else x.termine = prossimo ? Math.min(prossimo, x.inizio + 120 * MIN) : x.inizio + 120 * MIN;
  });
  return oggi;
}

function pannelloLive(oggi, t){

  const delGiorno = dati.items.filter(x => x.g === oggi);
  if (vista !== "prog" && vista !== "mio" || !delGiorno.length){ el.hidden = true; return; }
  const primo = Math.min(...delGiorno.map(x => x.inizio)), fine = Math.max(...delGiorno.map(x => x.termine));
  if (t < primo - 30 * MIN || t > fine){ el.hidden = true; return; }

  const carta = (titolo, cur, next, rit) => `<div class="carta${cur ? "" : " vuota"}">
      <div class="sala"><span>${esc(titolo)}</span>${rit ? `<span class="rit">+${rit} min</span>` : ""}</div>
      ${cur ? `<div class="ora-tit">${tag(cur)}${esc(cur.titolo)}</div>${cur.relatore ? `<div class="chi">${esc(cur.relatore)}</div>` : ""}`
            : `<div class="ora-tit">Nessun intervento in questo momento</div>`}
      ${cur && domandaAperta(cur, t) ? `<button class="chiedi" data-q="${esc(cur.codice)}">Fai una domanda</button>` : ""}
      ${next ? `<div class="poi">A seguire, <b>${hhmm(next.inizio)}</b>: ${esc(next.relatore || next.titolo)}</div>` : ""}
    </div>`;
  const comune = delGiorno.find(x => x.comune && x.inizio <= t && t < x.termine);
  const qualcosa = delGiorno.some(x => x.inizio <= t && t < x.termine);
  const prossimoTutti = delGiorno.filter(x => x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
  let carte;
  if (comune || !dati.sale.length || (!qualcosa && prossimoTutti?.comune)){
    const next = delGiorno.filter(x => x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
    carte = carta(comune && ETICHETTA[comune.tipo] || "Tutte le sale", comune, next, comune?.rit);
  } else {
    carte = dati.sale.map(s => {
      const qui = delGiorno.filter(x => x.sala === s || x.comune).sort((a,b) => a.inizio - b.inizio);
      return carta(s, qui.find(x => x.inizio <= t && t < x.termine), qui.find(x => x.inizio > t), qui.find(x => x.sala === s)?.rit);
    }).join("");
  }
  const mio = delGiorno.filter(x => preferiti.has(x.codice) && x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
  const tuo = mio ? `<div class="tuo">Il tuo prossimo: <b>${hhmm(mio.inizio)}</b>, ${esc(mio.relatore || mio.titolo)} · ${esc(mio.comune ? "tutte le sale" : mio.sala)}</div>` : "";
  el.hidden = false;
  el.innerHTML = `<h2><span class="punto"></span>Ora in corso<small class="prog">secondo il programma</small></h2><div class="carte">${carte}</div>${tuo}`;
}

/* programma di un giorno, con le sessioni parallele raggruppate */
function elencoGiorno(g, t){
  const items = dati.items.filter(x => x.g === g).sort((a,b) => a.base - b.base || idxSala(a.sala) - idxSala(b.sala));
  const blocchi = [], perSessione = {};
  items.forEach(x => {
    if (x.comune){ blocchi.push({comune:x}); return; }
    const k = x.sala + "|" + x.sessione;
    if (!perSessione[k]){ perSessione[k] = {sala:x.sala, sessione:x.sessione, chair:x.chair, voci:[]}; blocchi.push(perSessione[k]); }
    perSessione[k].voci.push(x);
  });
  const html = blocchi.filter(b => b.comune || !filtro || b.sala === filtro).map(b => {
    if (b.comune){
      const x = b.comune, speciale = ["PL","GS","SP"].includes(x.tipo);
      return `<div class="blocco comune ${speciale ? "speciale" : "pausa"}">${voce(x, t, speciale ? `<div class="quando">${esc(ETICHETTA[x.tipo])} · tutte le sale</div>` : "")}</div>`;
    }
    return `<div class="blocco"><div class="intest s${idxSala(b.sala)}">
        <div class="nome">${esc(b.sessione || "Sessione")}</div>
        <div class="dett"><b>${esc(b.sala)}</b>${b.chair ? ` · Chair: ${esc(b.chair)}` : ""}</div></div>
      <div class="gruppo">${b.voci.map(x => voce(x, t)).join("")}</div></div>`;
  }).join("");
  return html || `<div class="vuoto">Nessun intervento per questa sala in questo giorno.</div>`;
}

/* ===== moduli Google: domande e prenotazioni ===== */
function leggiModulo(link, campi){
  const m = String(link).match(/\/forms\/d\/e\/([^/]+)\//); if (!m) return null;
  const mappa = {};
  try { for (const [k, v] of new URL(link).searchParams)
    if (k.startsWith("entry.")) for (const [nome, segnaposto] of Object.entries(campi))
      if (v.trim().toUpperCase() === segnaposto) mappa[nome] = k; } catch(e){ return null; }
  return {id: m[1], campi: mappa};
}
const modDomande = leggiModulo(MODULO_DOMANDE, {codice:"CODICE", testo:"DOMANDA", nome:"NOME"});
const modCaffe = leggiModulo(MODULO_CAFFE, {slot:"SLOT", nome:"NOME", email:"EMAIL", ruolo:"RUOLO"});
async function invia(mod, valori){
  const corpo = new URLSearchParams();
  for (const [k, v] of Object.entries(valori)) if (mod.campi[k]) corpo.append(mod.campi[k], v);
  await fetch(`https://docs.google.com/forms/d/e/${mod.id}/formResponse`, {method:"POST", mode:"no-cors", body:corpo});
}

/* modalità chair: le domande della propria sala */
let chairSala = mem.get("chair-sala", ""), chairCodice = "", domande = [], domandeErr = false;
const fatte = new Set(mem.get("fatte", []));
async function caricaDomande(){
  if (chairTab === "punteggi" || !chairEntrato()){ return; }
  if (!RISPOSTE_DOMANDE){ domande = mem.get("demo-domande", []); domandeErr = false; return disegnaChair(); }
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${RISPOSTE_DOMANDE}/gviz/tq?tqx=out:csv&headers=1&t=${Date.now()}`, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    domande = csv(await r.text()).map(riga => {
      const k = Object.keys(riga), trova = w => k.find(x => x.toLowerCase().includes(w));
      const ts = riga[k[0]] || "", m = ts.match(/(\d{1,2}):(\d{2})/);
      return {id: ts + "|" + (riga[trova("domanda")] || ""), ora: m ? `${m[1].padStart(2,"0")}:${m[2]}` : "",
        codice: (riga[trova("codice")] || "").trim(), testo: riga[trova("domanda")] || "", nome: riga[trova("nome")] || ""};
    }).filter(d => d.testo);
    domandeErr = false;
  } catch(e){ domandeErr = true; }
  disegnaChair();
}
/* accesso chair con password condivisa */
const modPunteggi = leggiModulo(MODULO_PUNTEGGI, {codice:"CODICE", chair:"CHAIR", c1:"CRITERIO1", c2:"CRITERIO2", c3:"CRITERIO3", totale:"TOTALE", note:"NOTE"});
async function impronta(pw){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("CSA-chair|" + pw));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
const chairEntrato = () => mem.get("chair-accesso", "") === CHAIR_HASH;
let chairTab = mem.get("chair-tab", "domande"), chairGiorno = "", chairFiltro = "mie", aperto = "", bozza = {};
const punteggi = mem.get("punteggi", {});
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function mioChair(x){
  const parole = norm(mem.get("chair-nome", "")).split(/\s+/).filter(w => w.length > 2);
  return parole.length > 0 && parole.every(w => norm(x.chair).includes(w));
}

function disegnaChair(){
  if (!dati) return;
  document.body.classList.add("chair");
  if (!chairEntrato()) return schermataAccesso();
  const oggi = calcola(), t = adesso();
  const sale = dati.sale.length ? dati.sale : ["Tutte"];
  if (!sale.includes(chairSala)) chairSala = sale[0];
  const giorno = dati.giorni.includes(oggi) ? oggi : (scelta || dati.giorni[0]);
  if (!dati.giorni.includes(chairGiorno)) chairGiorno = giorno;
  const testa = menuArea("chair") + `<div class="chair-testa"><h2 class="titolo-vista">Modalità chair</h2>
      <span>${esc(mem.get("chair-nome", ""))} · <button class="esci" id="esci">Esci</button></span></div>

      <button data-ctab="punteggi" class="${chairTab === "punteggi" ? "on" : ""}">Punteggi</button></div>
    <div class="filtri">${sale.map(s => `<button data-csala="${esc(s)}" class="${s === chairSala ? "on" : ""}">${esc(nomeSala(s))}</button>`).join("")}</div>`;
  $("lista").innerHTML = testa + (chairTab === "punteggi" ? schedaPunteggi(t) : schedaDomande(giorno, t));
}

function schedaDomande(giorno, t){
  const interventi = dati.items.filter(x => x.g === giorno && x.codice && (x.sala === chairSala || x.comune))
    .sort((a,b) => a.inizio - b.inizio);
  const corrente = [...interventi].reverse().find(x => x.inizio <= t) || interventi[0];
  const scelto = interventi.find(x => x.codice === chairCodice) || corrente;
  const qui = domande.filter(d => scelto && d.codice === scelto.codice)
    .map((d, i) => ({...d, id: d.id || String(i)})).sort((a,b) => fatte.has(a.id) - fatte.has(b.id));
  return `<label class="chair-sel">Intervento<select id="csel">${interventi.map(x => `<option value="${esc(x.codice)}" ${x === scelto ? "selected" : ""}>
      ${hhmm(x.inizio)} · ${esc(x.codice)} · ${esc(x.relatore || x.titolo)}${x === corrente ? " (ora)" : ""}</option>`).join("")}</select></label>
    ${scelto ? `<div class="chair-int">${tag(scelto)}<b>${esc(scelto.titolo)}</b><div class="rel">${esc(scelto.relatore)}</div></div>` : ""}

/* ===== classifica dei punteggi, con normalizzazione per chair ===== */
let valutazioni = null, tabClass = "OR", nomeFile = "";
function leggiPunteggiCsv(testo){
  const righe = csv(testo.replace(/^\uFEFF/, ""));
  if (!righe.length) return [];
  const k = Object.keys(righe[0]), trova = (...w) => k.find(x => w.some(p => norm(x).includes(p)));
  const kc = trova("codice"), kch = trova("chair"), kt = trova("totale"), kcr = k.filter(x => norm(x).includes("criterio"));
  const numero = v => parseFloat(String(v).replace(",", "."));
  const ultime = {};
  righe.forEach(r => {
    const codice = (r[kc] || "").trim().toUpperCase(), chair = (r[kch] || "").trim();
    let tot = numero(r[kt]);
    if (isNaN(tot) && kcr.length) tot = kcr.reduce((a, x) => a + (numero(r[x]) || 0), 0);
    if (!codice || !chair || isNaN(tot)) return;
    ultime[norm(chair) + "|" + codice] = {codice, chair, tot, tipo: (codice.match(/^[A-Z]+/) || [""])[0]};   // conta l'ultima
  });
  return Object.values(ultime);
}
function calcolaClassifica(v){
  const media = a => a.reduce((x, y) => x + y, 0) / a.length;
  const ds = a => a.length > 1 ? Math.sqrt(a.reduce((x, y) => x + (y - media(a)) ** 2, 0) / (a.length - 1)) : 0;
  const tutti = v.map(x => x.tot), mG = media(tutti), sG = ds(tutti) || 1;
  const chairs = {};
  v.forEach(x => (chairs[x.chair] ??= []).push(x.tot));
  const statChair = Object.entries(chairs).map(([chair, a]) => {
    const affidabile = a.length >= 3 && ds(a) > 0;
    return {chair, n: a.length, m: media(a), s: ds(a), affidabile, rif: affidabile ? [media(a), ds(a)] : [mG, sG]};
  }).sort((a,b) => b.m - a.m);
  const rif = Object.fromEntries(statChair.map(c => [c.chair, c.rif]));
  const perIntervento = {};
  v.forEach(x => {
    const [m, sd] = rif[x.chair];
    const T = 50 + 10 * (x.tot - m) / sd;
    (perIntervento[x.codice] ??= {codice: x.codice, tipo: x.tipo, grezzi: [], T: [], chair: []});
    perIntervento[x.codice].grezzi.push(x.tot); perIntervento[x.codice].T.push(T); perIntervento[x.codice].chair.push(x.chair);
  });
  const interventi = Object.values(perIntervento).map(i => ({...i, grezzo: media(i.grezzi), norm: media(i.T)}))
    .sort((a,b) => b.norm - a.norm || b.grezzo - a.grezzo);
  return {interventi, statChair, mG, n: v.length};
}
function disegnaClassifica(){
  if (!dati) return;
  document.body.classList.add("schermo", "classifica");
  if (!chairEntrato()) return schermataAccesso("Classifica punteggi", "Accesso riservato agli organizzatori.", disegnaClassifica);
  let html = menuArea("classifica") + `<h2 class="titolo-vista">Classifica punteggi</h2>
    <p class="sotto-vista">Nel foglio dei punteggi: File › Scarica › Valori separati da virgola (.csv), poi carica qui il file.
      I dati restano su questo computer.</p>
    <label class="carica">${valutazioni ? "Carica un altro file" : "Carica il file CSV"}<input type="file" id="csv-in" accept=".csv,text/csv"></label>
    ${nomeFile ? `<span class="aff"> ${esc(nomeFile)}</span>` : ""}`;
  if (valutazioni && !valutazioni.length) html += `<div class="vuoto">Nel file non trovo punteggi validi: controlla che sia il foglio delle risposte del modulo Punteggi.</div>`;
  if (valutazioni && valutazioni.length){
    const c = calcolaClassifica(valutazioni);
    const nomi = {}; dati.items.forEach(x => nomi[x.codice] = x.relatore);
    const tipi = [["OR", "Orali"], ["FL", "Flash"], ["chair", "Chair"]];
    html += `<p class="sotto-vista">${c.n} valutazioni di ${c.statChair.length} chair su ${c.interventi.length} interventi.</p>
      <div class="schede cl-schede">${tipi.map(([k, n]) => `<button data-cl="${k}" class="${tabClass === k ? "on" : ""}">${n}</button>`).join("")}</div>`;
    if (tabClass === "chair"){
      html += `<table class="cl"><thead><tr><th>Chair</th><th>Valutazioni</th><th>Media /30</th><th>Rispetto alla media generale</th></tr></thead><tbody>
        ${c.statChair.map(s => { const d = s.m - c.mG;
          return `<tr><td><b>${esc(s.chair)}</b>${s.affidabile ? "" : `<div class="cl-nota">Troppo poche valutazioni o tutte uguali: i suoi punteggi non vengono corretti</div>`}</td>
            <td>${s.n}</td><td>${s.m.toFixed(1)}</td>
            <td class="${Math.abs(d) >= 1.5 ? (d > 0 ? "cl-su" : "cl-giu") : ""}">${d >= 0 ? "+" : ""}${d.toFixed(1)} ${Math.abs(d) < 1.5 ? "in linea" : d > 0 ? "più generoso" : "più severo"}</td></tr>`; }).join("")}
        </tbody></table>`;
    } else {
      const lista = c.interventi.filter(i => i.tipo === tabClass);
      html += `<table class="cl"><thead><tr><th></th><th>Intervento</th><th>Normalizzato</th><th>Media /30</th><th>Chair</th></tr></thead><tbody>
        ${lista.map((i, k) => `<tr class="${k < 3 ? "cl-top" : ""}"><td class="cl-pos">${k + 1}</td>
          <td><b>${esc(nomi[i.codice] || i.codice)}</b> <span class="aff">${esc(i.codice)}</span></td>
          <td class="cl-norm">${i.norm.toFixed(1)}</td><td>${i.grezzo.toFixed(1)}</td>
          <td>${i.chair.length}</td></tr>`).join("") || `<tr><td colspan="5">Nessuna valutazione.</td></tr>`}
        </tbody></table>`;
    }
    html += `<div class="cl-az"><button id="cl-csv">Scarica la classifica (CSV)</button><button id="cl-stampa">Stampa</button></div>
      <div class="cl-metodo"><b>Come si legge.</b> Ogni chair ha il suo metro: c'è chi dà 7 a un buon intervento e chi dà 9.
        Per confrontarli, ogni punteggio viene rapportato alla media e alla variabilità dei voti di quel chair:
        50 significa "nella media di quel chair", 60 "nettamente sopra la sua media", 40 "sotto".
        La classifica usa questo valore normalizzato; a parità, conta la media grezza su 30.
        Se un intervento ha più chair, si fa la media dei loro valori. I chair con meno di tre valutazioni non vengono corretti.</div>`;
    window._classifica = c;
  }
  $("lista").innerHTML = html;
  $("csv-in").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    nomeFile = f.name; valutazioni = leggiPunteggiCsv(await f.text()); disegnaClassifica();
  };
  if ($("cl-csv")) $("cl-csv").onclick = () => {
    const c = window._classifica, nomi = {}; dati.items.forEach(x => nomi[x.codice] = x.relatore);
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const righe = [["Tipo","Posizione","Codice","Relatore","Normalizzato","Media su 30","Numero di chair"].map(q).join(",")];
    ["OR","FL"].forEach(t => c.interventi.filter(i => i.tipo === t).forEach((i, k) =>
      righe.push([t, k + 1, i.codice, nomi[i.codice] || "", i.norm.toFixed(1), i.grezzo.toFixed(1), i.chair.length].map(q).join(","))));
    const url = URL.createObjectURL(new Blob(["\uFEFF" + righe.join("\r\n")], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = "classifica-punteggi.csv"; document.body.appendChild(a); a.click(); a.remove();
  };
  if ($("cl-stampa")) $("cl-stampa").onclick = () => window.print();
}

/* passaggio tra app, area chair e schermi della sala */
function apriPagina(nome){
  const q = new URLSearchParams(location.search), n = new URLSearchParams();
  if (q.get("ora")) n.set("ora", q.get("ora"));
  let cerca = n.toString();
  if (nome) cerca += (cerca ? "&" : "") + nome;
  location.search = cerca;
}
const menuArea = attiva => `<div class="area-menu">
    ${[["chair","Domande e punteggi"],["classifica","Classifica"],["nuvola","Schermo nuvola"],["risultati","Schermo voto"]]
      .map(([k, n]) => `<button data-pagina="${k}" class="${attiva === k ? "on" : ""}">${n}</button>`).join("")}
    <button data-pagina="" class="torna">Torna all'app</button></div>`;

/* disegno */
function disegna(){
  if (CHAIR && dati) return disegnaChair();
  if (SCHERMO && dati) return disegnaSchermo();
  if (CLASSIFICA && dati) return disegnaClassifica();
  if (!dati){
    $("lista").innerHTML = `<div class="vuoto">${errore ? "Non riesco a leggere il programma. Controlla la connessione, riprovo tra poco." : "Caricamento del programma…"}</div>`;
    return;
  }
  const oggi = calcola(), t = adesso();
  if (!scelta || !dati.giorni.includes(scelta))
    scelta = dati.giorni.includes(oggi) ? oggi : (dati.giorni.includes(mem.get("giorno")) ? mem.get("giorno") : dati.giorni[0]);

  $("stato").textContent = (errore ? (ultimo ? `Senza connessione: dati delle ${hhmm(ultimo)}` : "Senza connessione")
    : SHEET_ID ? `Aggiornato alle ${hhmm(ultimo)}` : "Dati di prova: edizione 2025")
    + (scarto ? ` · simulazione del ${etichettaGiorno(oggi)} alle ${hhmm(t)}` : "");
  if (dati.giorni.length){
    const gg = dati.giorni.map(g => +g.slice(8)), mese = etichettaGiorno(dati.giorni[0], true).split(" ").pop();
    $("date").textContent = `Bari, ${gg.length > 1 ? gg.slice(0,-1).join(", ") + " e " + gg.at(-1) : gg[0]} ${mese} ${dati.giorni[0].slice(0,4)}`;
  }
  $("avviso").innerHTML = dati.avviso ? `<div class="avviso">${esc(dati.avviso)}</div>` : "";
  pannelloLive(oggi, t);
  pannelloPubblico(t);

  const conta = [...preferiti].length;
  $("conta").hidden = !conta; $("conta").textContent = conta;
  if (vista === "vota") vista = "partecipa";
  const gruppoAltro = ["altro","partecipa","caffe","opportunita","info"];
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === vista || (b.dataset.v === "altro" && gruppoAltro.includes(vista))));
  $("pallino").hidden = !(nuvolaAttiva() || votiAperti(t).length);

  $("barra").hidden = vista !== "prog";
  $("pdf").hidden = vista !== "prog" || !PDF_PROGRAMMA || !!cercato;
  if (PDF_PROGRAMMA) $("pdf").href = PDF_PROGRAMMA;
  if (vista === "prog"){
    $("schede").innerHTML = dati.giorni.map(g => `<button data-g="${g}" class="${scelta === g ? "on" : ""}">${esc(etichettaGiorno(g))}</button>`).join("");
    $("filtri").hidden = !!cercato || dati.sale.length < 2;
    $("filtri").innerHTML = [["", "Tutte le sale"], ...dati.sale.map(s => [s, nomeSala(s)])]
      .map(([v, n]) => `<button data-s="${esc(v)}" class="${filtro === v ? "on" : ""}">${esc(n)}</button>`).join("");
  }
  $("lista").innerHTML =
      vista === "mio" ? vistaMio(t)
    : vista === "poster" ? vistaPoster()
    : vista === "info" ? vistaInfo()
    : vista === "altro" ? vistaAltro(t)
    : vista === "partecipa" ? vistaPartecipa(t)
    : vista === "caffe" ? vistaCarriera(t, "caffe")
    : vista === "opportunita" ? vistaCarriera(t, "opp")
    : cercato.length >= 2 ? risultati(cercato, t) : elencoGiorno(scelta, t);

  legaNuvola();
  if (scorriAdesso && vista === "prog" && $("adesso")) $("adesso").scrollIntoView({block:"center"});
  scorriAdesso = false;
}

/* comandi */
document.querySelector(".nav").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  vista = b.dataset.v; disegna(); window.scrollTo({top:0}); };
$("schede").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  scelta = b.dataset.g; mem.set("giorno", scelta); cercato = ""; $("q").value = ""; $("qx").hidden = true; disegna(); };
$("filtri").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.s; mem.set("sala", filtro); disegna(); };
$("q").oninput = e => { cercato = e.target.value.trim(); $("qx").hidden = !cercato; disegna(); };
$("qx").onclick = () => { $("q").value = ""; cercato = ""; $("qx").hidden = true; disegna(); $("q").focus(); };
$("lista").addEventListener("click", e => {
  const b = e.target.closest(".stella"); if (!b) return;
  const c = b.dataset.star; preferiti.has(c) ? preferiti.delete(c) : preferiti.add(c);
  mem.set("preferiti", [...preferiti]); disegna();
});
document.addEventListener("click", e => {
  const pg = e.target.closest("[data-pagina]"); if (pg){ apriPagina(pg.dataset.pagina); return; }
  const q = e.target.closest(".chiedi"); if (q){ apriDomanda(q.dataset.q); return; }
  const f = e.target.closest(".fascia"); if (f && !f.disabled){ apriPrenota(f.dataset.slot); return; }
  const o = e.target.closest("[data-opp]"); if (o){ filtroOpp = o.dataset.opp; disegna(); return; }
  const cs = e.target.closest("[data-csala]"); if (cs){ chairSala = cs.dataset.csala; chairCodice = ""; mem.set("chair-sala", chairSala); if (chairFiltro === "mie") chairFiltro = "sala"; disegnaChair(); return; }
  const ct = e.target.closest("[data-ctab]"); if (ct){ chairTab = ct.dataset.ctab; mem.set("chair-tab", chairTab); disegnaChair(); if (chairTab === "domande") caricaDomande(); return; }
  const cf = e.target.closest("[data-cfiltro]"); if (cf){ chairFiltro = cf.dataset.cfiltro; if (cf.dataset.cg) chairGiorno = cf.dataset.cg; aperto = ""; disegnaChair(); return; }
  const ap = e.target.closest("[data-apri]"); if (ap){ aperto = aperto === ap.dataset.apri ? "" : ap.dataset.apri; disegnaChair();
    document.querySelector(".p-riga.aperto")?.scrollIntoView({block:"start", behavior:"smooth"}); return; }
  const vc = e.target.closest("[data-voto-c]"); if (vc){ const b = bozza[aperto]; if (b){ b.note = $("p-note")?.value || b.note; b.voti[+vc.dataset.votoC] = +vc.dataset.v; disegnaChair(); } return; }
  const pm = e.target.closest("[data-manda]"); if (pm){ mandaPunteggio(pm.dataset.manda); return; }
  if (e.target.id === "esci"){ mem.set("chair-accesso", ""); disegnaChair(); return; }
  const df = e.target.closest("[data-fatta]"); if (df){ const k = df.dataset.fatta; fatte.has(k) ? fatte.delete(k) : fatte.add(k); mem.set("fatte", [...fatte]); disegnaChair(); }
});
document.addEventListener("click", e => {
  if (e.target.closest("#cal")){ esportaCalendario(); return; }
  const vv = e.target.closest("[data-vai]"); if (vv){ vista = vv.dataset.vai; disegna(); window.scrollTo({top:0}); return; }
  const c = e.target.closest("[data-voto]"); if (c){ vota(c.dataset.voto, c.dataset.cod); return; }
  const n = e.target.closest("[data-nascondi]"); if (n){ nascoste.add(n.dataset.nascondi); mem.set("nascoste", [...nascoste]); disegnaSchermo(); }
});
document.addEventListener("input", e => {
  if (e.target.classList.contains("cerca-voto")){
    const cat = e.target.dataset.cat, pos = e.target.selectionStart; cercaVoto[cat] = e.target.value; disegna();
    const nuovo = document.querySelector(`.cerca-voto[data-cat="${CSS.escape(cat)}"]`); if (nuovo){ nuovo.focus(); nuovo.setSelectionRange(pos, pos); }
  }
});
document.addEventListener("click", e => { const b = e.target.closest("[data-cl]"); if (b){ tabClass = b.dataset.cl; disegnaClassifica(); } });
document.addEventListener("change", e => { if (e.target.id === "csel"){ chairCodice = e.target.value; disegnaChair(); } });

$("piede").textContent = "Gli orari in corso seguono il programma e gli eventuali ritardi comunicati dagli organizzatori.";

/* funzionamento offline e installazione */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
bannerInstalla();

carica();
if (CHAIR){ caricaDomande(); setInterval(caricaDomande, 15000); }
if (SCHERMO){ caricaSchermo(); setInterval(caricaSchermo, 4000); }
setInterval(() => carica(true), AGGIORNA_LIVE * 1000);
setInterval(() => carica(false), AGGIORNA_TUTTO * 60000);
setInterval(() => { if (!dati) return;
  const a = document.activeElement; if (a && (a.id === "nv-in" || a.classList.contains("cerca-voto"))) return;
  if (CLASSIFICA) return;
  disegna(); }, 30000);
</script>
</body>
</html>
