<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Chimica sotto l'Albero 2026</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CSA 2026">

<style>
  :root{
    --blu:#2B2D55; --azzurro:#E7F3FA; --rosso:#A23F30; --rosato:#F6ECE9;
    --grigio:#9A9AA0; --linea:#E2E2E6; --testo:#2B2B2B;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
  body{margin:0;background:#fff;color:var(--testo);
    font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}

  /* intestazione come gli altri riquadri del sito */
  header.top{padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 4px}
  header.top h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:23px;font-weight:600;color:var(--blu)}
  header.top p{margin:0;font-size:14px;color:var(--rosso);font-weight:600}
  .stato{font-size:12px;color:var(--grigio);margin-top:2px}

  .avviso{margin:10px 0 0;padding:8px 12px;border-radius:8px;background:var(--rosato);color:var(--rosso);font-size:14px}

  /* pannello "ora in corso" */
  .live{margin-top:12px}
  .live h2{margin:0 0 6px;font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--rosso);
    display:flex;align-items:center;gap:8px}
  .live h2 .punto{width:8px;height:8px;border-radius:50%;background:var(--rosso);animation:pulsa 1.6s infinite}
  @keyframes pulsa{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.live h2 .punto{animation:none}}
  .live small.prog{font-family:"Open Sans",system-ui,sans-serif;font-size:12px;font-weight:400;color:var(--grigio);margin-left:auto}
  .carte{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
  .carta{border-radius:10px;padding:10px 12px;background:var(--rosato)}
  .carta:nth-child(2){background:var(--azzurro)}
  .carta .sala{font-size:12.5px;font-weight:600;color:#66666c;display:flex;justify-content:space-between;gap:6px}
  .carta .rit{color:var(--rosso)}
  .carta .ora-tit{margin-top:3px;font-family:"Playfair Display",Georgia,serif;font-size:16px;font-weight:600;color:var(--blu);line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .carta .chi{font-size:13.5px;margin-top:2px}
  .carta .poi{margin-top:6px;font-size:12.5px;color:#66666c}
  .carta .poi b{color:var(--testo)}
  .carta.vuota .ora-tit{font-family:"Open Sans",system-ui,sans-serif;font-size:14px;font-weight:400;color:#66666c}

  /* barra fissa: giorni come i tasti delle quote, sale come etichette */
  .barra{position:sticky;top:0;z-index:5;background:#fff;padding:10px 0 8px;margin-top:12px;
    padding-top:calc(env(safe-area-inset-top,0px) + 10px);border-bottom:1px solid var(--linea)}
  .schede{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .schede button{border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:7px 4px;font:inherit;font-size:15px;
    font-weight:600;color:var(--testo);cursor:pointer}
  .schede button.on{background:var(--rosso);border-color:var(--rosso);color:#fff}
  .filtri{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .filtri::-webkit-scrollbar{display:none}
  .filtri button{flex:none;border:0;background:var(--azzurro);border-radius:12px;padding:4px 12px;font:inherit;font-size:13px;color:var(--blu);cursor:pointer}
  .filtri button.on{background:var(--blu);color:#fff}
  .cerca{margin-top:8px;position:relative}
  .cerca input{width:100%;border:1px solid var(--linea);border-radius:6px;padding:7px 32px 7px 10px;font:inherit;font-size:16px;background:#fff}
  .cerca button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;color:var(--grigio);cursor:pointer;padding:4px 8px}
  button:focus-visible,input:focus-visible{outline:3px solid var(--blu);outline-offset:1px}

  /* elenco, nello stile delle righe delle quote */
  main{padding:6px 0 30px}
  .blocco{margin-top:14px}
  .intest{padding:0 0 4px;border-bottom:2px solid var(--blu)}
  .intest.s1{border-bottom-color:var(--rosso)}
  .intest .nome{font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--blu)}
  .intest .dett{font-size:12.5px;color:#66666c}
  .intest .dett b{font-weight:600;color:var(--blu)}
  .intest.s1 .dett b{color:var(--rosso)}
  .voce{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
  .gruppo .voce:first-child{border-top:0}
  .ora{flex:none;width:44px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--blu)}
  .ora s{display:block;font-weight:400;font-size:11.5px;color:var(--grigio)}
  .corpo{min-width:0;flex:1}
  .tit{font-weight:600;line-height:1.3}
  .rel{font-size:13.5px;margin-top:2px}
  .rel b{font-weight:600}
  .aff{color:#66666c}
  .nota{font-size:12.5px;color:#66666c;margin-top:3px}
  .tag{font-family:"Open Sans",system-ui,sans-serif;display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;margin-right:6px;vertical-align:1px;white-space:nowrap}
  .t-OR{background:var(--azzurro);color:var(--blu)}
  .t-FL{background:var(--rosato);color:var(--rosso)}
  .t-PL,.t-GS{background:var(--rosso);color:#fff}
  .t-SP{background:var(--azzurro);color:var(--blu)}
  .t-P{background:var(--rosato);color:var(--rosso)}
  .comune .voce{border-top:0}
  .comune.pausa{border-top:1px solid var(--linea);border-bottom:1px solid var(--linea)}
  .comune.pausa .tit{font-weight:400;color:#66666c;font-style:italic}
  .comune.speciale{background:var(--rosato);border-radius:10px;padding:0 12px}
  .comune.speciale .tit{font-family:"Playfair Display",Georgia,serif;font-size:16.5px;color:var(--blu)}
  .voce.passata{opacity:.45}
  .voce.incorso{background:var(--rosato);border-radius:8px;margin:0 -8px;padding-left:8px;padding-right:8px}
  .voce.incorso .ora{color:var(--rosso)}
  .badge{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--rosso);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  .vuoto{padding:30px 10px;text-align:center;color:#66666c}
  .sessp h3{margin:16px 0 4px;font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:600;color:var(--blu);
    padding-bottom:4px;border-bottom:2px solid var(--blu)}
  .risultati-tit{font-size:13px;color:#66666c;margin:10px 0 4px}
  .quando{font-size:12px;color:var(--rosso);font-weight:600;margin-bottom:1px}
  footer{font-size:12px;color:var(--grigio);text-align:center;padding:10px 0 24px}
  /* ===== app ===== */
  body{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 64px)}
  header.top{display:flex;align-items:center;gap:12px}
  header.top img{height:46px;width:auto}
  header.top .testi{min-width:0}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--linea);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
  .nav button{border:0;background:none;padding:7px 2px 6px;font:inherit;font-size:11.5px;color:#66666c;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px}
  .nav button svg{width:22px;height:22px}
  .nav button.on{color:var(--rosso);font-weight:600}
  .nav .conta{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--rosso);
    color:#fff;font-size:10px;line-height:16px;padding:0 4px}
  .nav button{position:relative}

  .stella{flex:none;align-self:flex-start;border:0;background:none;padding:2px 0 4px 4px;cursor:pointer;color:#C9C9CE}
  .stella svg{width:22px;height:22px;display:block}
  .stella.on{color:var(--rosso)}
  .stella.on svg path{fill:currentColor}

  .titolo-vista{margin:16px 0 2px;font-family:"Playfair Display",Georgia,serif;font-size:22px;font-weight:600;color:var(--blu)}
  .sotto-vista{margin:0 0 6px;font-size:13.5px;color:#66666c}
  .giorno-mio{margin:14px 0 2px;font-weight:600;color:var(--rosso)}
  .conflitto{font-size:12px;color:var(--rosso);font-weight:600;margin-top:2px}

  .info-voce{padding:12px 0;border-top:1px solid var(--linea)}
  .info-voce h3{margin:0;font-family:"Playfair Display",Georgia,serif;font-size:17px;font-weight:600;color:var(--blu)}
  .info-voce p{margin:3px 0 0;white-space:pre-line}
  .info-voce a.link{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:4px;background:var(--rosso);color:#fff;
    text-decoration:none;font-weight:600;font-size:14px}

  .installa{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--azzurro);display:flex;gap:10px;align-items:center}
  .installa p{margin:0;font-size:13.5px;flex:1;color:var(--blu)}
  .installa button{border:0;border-radius:4px;padding:7px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .installa .si{background:var(--rosso);color:#fff}
  .installa .no{background:none;color:#66666c;padding:7px 4px}
  .pdf{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--rosso);text-decoration:none}
  .pdf::before{content:"";width:14px;height:14px;background:currentColor;
    -webkit-mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>') center/contain no-repeat;
    mask:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>') center/contain no-repeat}
  .tuo{margin-top:8px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--rosso);font-size:13.5px}
  .tuo b{color:var(--rosso)}
</style>
</head>
<body>
<header class="top wrap">
  <img src="logo.png" alt="" onerror="this.remove()">
  <div class="testi">
    <h1 id="h1">Chimica sotto l'Albero</h1>
    <p id="date"></p>
    <div class="stato" id="stato"></div>
  </div>
</header>

<div class="wrap">
  <div id="installa"></div>
  <div id="avviso"></div>
  <section class="live" id="live" hidden></section>

  <div class="barra" id="barra">
    <div class="schede" id="schede"></div>
    <div class="filtri" id="filtri"></div>
    <div class="cerca">
      <input id="q" type="text" enterkeyhint="search" placeholder="Cerca relatore, titolo o codice" aria-label="Cerca nel programma" autocomplete="off">
      <button id="qx" aria-label="Cancella ricerca" hidden>×</button>
    </div>
  </div>

  <a class="pdf" id="pdf" target="_blank" rel="noopener" hidden>Scarica il programma in PDF</a>
  <main id="lista"></main>
  <footer id="piede"></footer>
</div>

<nav class="nav" aria-label="Sezioni"><div class="in">

  <button data-v="mio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>Il mio<span class="conta" id="conta" hidden></span></button>
  <button data-v="poster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>Poster</button>
  <button data-v="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Info</button>
</div></nav>

/* date e orari sempre in ora italiana */
function offsetRoma(t){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Rome",hourCycle:"h23",
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
    .formatToParts(new Date(t)).map(x => [x.type, x.value]));
  return Date.UTC(+p.year, p.month-1, +p.day, +p.hour, +p.minute, +p.second) - t;
}
function roma(g, o){
  const [Y,M,D] = g.split("-").map(Number), [h,m] = o.split(":").map(Number);
  const t = Date.UTC(Y, M-1, D, h, m);
  return t - offsetRoma(t);
}
function romaDaIso(s){ const [g,o="00:00"] = s.split("T"); return roma(g, o.slice(0,5)); }
function giornoRoma(t){
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t));
}
function hhmm(t){
  return new Intl.DateTimeFormat("it-IT",{timeZone:"Europe/Rome",hour:"2-digit",minute:"2-digit"}).format(new Date(t));
}
function etichettaGiorno(g, lunga){
  const f = new Intl.DateTimeFormat("it-IT", lunga ? {timeZone:"Europe/Rome",weekday:"long",day:"numeric",month:"long"}
                                                  : {timeZone:"Europe/Rome",weekday:"short",day:"numeric",month:"short"});
  const s = f.format(new Date(roma(g, "12:00"))).replace(".", "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* valori scritti nel foglio */
function normGiorno(v){
  v = String(v || "").trim();
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (m) return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  return "";
}
function normOra(v){
  const m = String(v || "").trim().match(/^(\d{1,2})[:.](\d{2})/);
  return m ? `${m[1].padStart(2,"0")}:${m[2]}` : "";
}

/* lettura dal foglio Google */
function csv(testo){
  const righe = []; let riga = [], campo = "", q = false;
  for (let i = 0; i < testo.length; i++){
    const c = testo[i];
    if (q){ if (c === '"'){ if (testo[i+1] === '"'){ campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === ","){ riga.push(campo); campo = ""; }
    else if (c === "\n"){ riga.push(campo); righe.push(riga); riga = []; campo = ""; }
    else if (c !== "\r") campo += c;
  }
  if (campo || riga.length){ riga.push(campo); righe.push(riga); }
  const [h, ...r] = righe;
  return r.map(x => Object.fromEntries(h.map((k,i) => [k.trim(), (x[i] ?? "").trim()])));
}
async function scheda(nome, facoltativa){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(nome)}&t=${Date.now()}`;
  try {
    const r = await fetch(url, {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    return csv(await r.text());
  } catch(e){ if (facoltativa) return []; throw e; }
}

function prepara(g){
  const items = (g.Programma || []).map(r => ({
    g: normGiorno(r["Giorno"]), ora: normOra(r["Ora"]), fine: normOra(r["Fine"]),
    sala: (r["Sala"] || "Tutte").trim() || "Tutte", sessione: r["Sessione"] || "", chair: r["Chair"] || "",
    codice: (r["Codice"] || "").trim(), titolo: r["Titolo"] || "", relatore: r["Relatore"] || "",
    aff: r["Affiliazione"] || "", note: r["Note"] || ""
  })).filter(x => x.g && x.ora && x.titolo);
  items.forEach(x => {
    x.tipo = (x.codice.match(/^[A-Za-z]+/) || [""])[0].toUpperCase();
    x.comune = x.sala.toLowerCase() === "tutte";
    x.base = roma(x.g, x.ora);
  });
  const sale = [...new Set(items.filter(x => !x.comune).map(x => x.sala))];
  const ritardi = {}; let avviso = "";
  (g.Live || []).forEach(r => {
    const s = (r["Sala"] || "").trim(), v = parseInt(r["Ritardo (minuti)"], 10);
    if (s) ritardi[s.toLowerCase()] = isNaN(v) ? 0 : v;
    if ((r["Avviso"] || "").trim()) avviso = r["Avviso"].trim();
  });
  const poster = (g.Poster || []).map(r => ({codice:(r["Codice"]||"").trim(), sess:String(r["Sessione poster"]||"").trim(),
    titolo:r["Titolo"]||"", autore:r["Autore"]||"", aff:r["Affiliazione"]||""})).filter(p => p.codice || p.titolo);
  const info = (g.Info || []).map(r => ({voce:r["Voce"]||"", testo:r["Testo"]||"", link:r["Link"]||"", etichetta:r["Testo del pulsante"]||""}))
    .filter(x => x.voce || x.testo);
  const giorni = [...new Set(items.map(x => x.g))].sort();
  return {items, sale, ritardi, avviso, poster, info, giorni};
}

/* orari effettivi, con i ritardi applicati solo al giorno in corso */
function calcola(){
  const oggi = giornoRoma(adesso());
  const {items, ritardi} = dati;
  items.forEach(x => {
    x.rit = x.g === oggi ? (ritardi[x.sala.toLowerCase()] || 0) : 0;
    x.inizio = x.base + x.rit * MIN;
  });
  items.forEach(x => {
    const dopo = items.filter(y => y.g === x.g && y.base > x.base && (x.comune || y.comune || y.sala === x.sala)).map(y => y.inizio);
    const prossimo = dopo.length ? Math.min(...dopo) : null;
    if (x.fine) x.termine = roma(x.g, x.fine) + x.rit * MIN;
    else if (DURATA[x.tipo]) x.termine = Math.min(x.inizio + DURATA[x.tipo] * MIN, prossimo ?? Infinity);
    else x.termine = prossimo ? Math.min(prossimo, x.inizio + 120 * MIN) : x.inizio + 120 * MIN;
  });
  return oggi;
}

  const primo = Math.min(...delGiorno.map(x => x.inizio)), fine = Math.max(...delGiorno.map(x => x.termine));
  if (t < primo - 30 * MIN || t > fine){ el.hidden = true; return; }

  const carta = (titolo, cur, next, rit) => `<div class="carta${cur ? "" : " vuota"}">
      <div class="sala"><span>${esc(titolo)}</span>${rit ? `<span class="rit">+${rit} min</span>` : ""}</div>
      ${cur ? `<div class="ora-tit">${tag(cur)}${esc(cur.titolo)}</div>${cur.relatore ? `<div class="chi">${esc(cur.relatore)}</div>` : ""}`
            : `<div class="ora-tit">Nessun intervento in questo momento</div>`}
      ${next ? `<div class="poi">A seguire, <b>${hhmm(next.inizio)}</b>: ${esc(next.relatore || next.titolo)}</div>` : ""}
    </div>`;
  const comune = delGiorno.find(x => x.comune && x.inizio <= t && t < x.termine);
  const qualcosa = delGiorno.some(x => x.inizio <= t && t < x.termine);
  const prossimoTutti = delGiorno.filter(x => x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
  let carte;
  if (comune || !dati.sale.length || (!qualcosa && prossimoTutti?.comune)){
    const next = delGiorno.filter(x => x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
    carte = carta(comune && ETICHETTA[comune.tipo] || "Tutte le sale", comune, next, comune?.rit);
  } else {
    carte = dati.sale.map(s => {
      const qui = delGiorno.filter(x => x.sala === s || x.comune).sort((a,b) => a.inizio - b.inizio);
      return carta(s, qui.find(x => x.inizio <= t && t < x.termine), qui.find(x => x.inizio > t), qui.find(x => x.sala === s)?.rit);
    }).join("");
  }
  const mio = delGiorno.filter(x => preferiti.has(x.codice) && x.inizio > t).sort((a,b) => a.inizio - b.inizio)[0];
  const tuo = mio ? `<div class="tuo">Il tuo prossimo: <b>${hhmm(mio.inizio)}</b>, ${esc(mio.relatore || mio.titolo)} · ${esc(mio.comune ? "tutte le sale" : mio.sala)}</div>` : "";
  el.hidden = false;
  el.innerHTML = `<h2><span class="punto"></span>Ora in corso<small class="prog">secondo il programma</small></h2><div class="carte">${carte}</div>${tuo}`;
}

/* programma di un giorno, con le sessioni parallele raggruppate */
function elencoGiorno(g, t){
  const items = dati.items.filter(x => x.g === g).sort((a,b) => a.base - b.base || idxSala(a.sala) - idxSala(b.sala));
  const blocchi = [], perSessione = {};
  items.forEach(x => {
    if (x.comune){ blocchi.push({comune:x}); return; }
    const k = x.sala + "|" + x.sessione;
    if (!perSessione[k]){ perSessione[k] = {sala:x.sala, sessione:x.sessione, chair:x.chair, voci:[]}; blocchi.push(perSessione[k]); }
    perSessione[k].voci.push(x);
  });
  const html = blocchi.filter(b => b.comune || !filtro || b.sala === filtro).map(b => {
    if (b.comune){
      const x = b.comune, speciale = ["PL","GS","SP"].includes(x.tipo);
      return `<div class="blocco comune ${speciale ? "speciale" : "pausa"}">${voce(x, t, speciale ? `<div class="quando">${esc(ETICHETTA[x.tipo])} · tutte le sale</div>` : "")}</div>`;
    }
    return `<div class="blocco"><div class="intest s${idxSala(b.sala)}">
        <div class="nome">${esc(b.sessione || "Sessione")}</div>
        <div class="dett"><b>${esc(b.sala)}</b>${b.chair ? ` · Chair: ${esc(b.chair)}` : ""}</div></div>
      <div class="gruppo">${b.voci.map(x => voce(x, t)).join("")}</div></div>`;
  }).join("");
  return html || `<div class="vuoto">Nessun intervento per questa sala in questo giorno.</div>`;
}

function vistaPoster(){
  const sess = [...new Set(dati.poster.map(p => p.sess))].sort();
  return `<h2 class="titolo-vista">Poster</h2>` + (sess.map(s => `<div class="sessp"><h3>Sessione poster ${esc(s)}</h3>
    <div class="gruppo">${dati.poster.filter(p => p.sess === s).map(p => vocePoster(p)).join("")}</div></div>`).join("")
    || `<div class="vuoto">Nessun poster.</div>`);
}

function vistaMio(t){
  const miei = dati.items.filter(x => preferiti.has(x.codice)).sort((a,b) => a.inizio - b.inizio);
  const mieiP = dati.poster.filter(p => preferiti.has(p.codice));
  let html = `<h2 class="titolo-vista">Il mio programma</h2>`;
  if (!miei.length && !mieiP.length)
    return html + `<p class="sotto-vista">Tocca la stellina accanto agli interventi e ai poster che vuoi seguire: li ritrovi qui, in ordine di orario, con la sala.</p>`;
  html += `<p class="sotto-vista">Le scelte restano salvate su questo telefono.</p>`;
  dati.giorni.forEach(g => {
    const qui = miei.filter(x => x.g === g); if (!qui.length) return;
    html += `<div class="giorno-mio">${esc(etichettaGiorno(g, true))}</div><div class="gruppo">` + qui.map((x, i) => {
      const prima = qui[i-1];
      const sovrapposto = prima && prima.termine > x.inizio && prima.sala !== x.sala && !prima.comune && !x.comune;
      return voce(x, t, `<div class="quando">${esc(x.comune ? "Tutte le sale" : x.sala)}</div>`)
        .replace('<div class="corpo">', `<div class="corpo">${sovrapposto ? '<div class="conflitto">In contemporanea con il precedente</div>' : ""}`);
    }).join("") + `</div>`;
  });
  if (mieiP.length) html += `<div class="sessp"><h3>Poster</h3><div class="gruppo">${mieiP.map(p => vocePoster(p, `<div class="quando">Sessione poster ${esc(p.sess)}</div>`)).join("")}</div></div>`;
  return html;
}

function vistaInfo(){
  return `<h2 class="titolo-vista">Informazioni</h2>` + (dati.info.map(x => `<div class="info-voce">
      <h3>${esc(x.voce)}</h3>${x.testo ? `<p>${esc(x.testo)}</p>` : ""}
      ${x.link ? `<a class="link" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.etichetta || "Apri")}</a>` : ""}</div>`).join("")
    || `<div class="vuoto">Nessuna informazione.</div>`);
}

function risultati(q, t){
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const parole = norm(q).split(/\s+/).filter(Boolean);
  const ok = s => parole.every(w => norm(s).includes(w));
  const vi = dati.items.filter(x => ok([x.codice, x.titolo, x.relatore, x.aff, x.note].join(" "))).sort((a,b) => a.base - b.base);
  const vp = dati.poster.filter(p => ok([p.codice, p.titolo, p.autore, p.aff].join(" ")));
  const n = vi.length + vp.length;
  return `<div class="risultati-tit">${n ? `${n} risultat${n === 1 ? "o" : "i"}` : "Nessun risultato"} per “${esc(q)}”</div>
    ${vi.length ? `<div class="gruppo">${vi.map(x => voce(x, t, `<div class="quando">${esc(etichettaGiorno(x.g))} · ${esc(x.comune ? "tutte le sale" : x.sala)}</div>`)).join("")}</div>` : ""}
    ${vp.length ? `<div class="sessp"><h3>Poster</h3><div class="gruppo">${vp.map(p => vocePoster(p, `<div class="quando">Sessione poster ${esc(p.sess)}</div>`)).join("")}</div></div>` : ""}`;
}

/* invito a installare l'app */
let promptInstalla = null;
const installata = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone;
const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptInstalla = e; bannerInstalla(); });
function bannerInstalla(){
  const el = $("installa");
  if (installata() || mem.get("no-installa", false) || !(promptInstalla || ios)){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="installa"><p>${promptInstalla ? "Installa l'app del convegno sul telefono."
      : "Per installare l'app: tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>."}</p>
    ${promptInstalla ? '<button class="si" id="inst-si">Installa</button>' : ""}<button class="no" id="inst-no" aria-label="Chiudi">×</button></div>`;
  if ($("inst-si")) $("inst-si").onclick = async () => { promptInstalla.prompt(); await promptInstalla.userChoice; promptInstalla = null; bannerInstalla(); };
  $("inst-no").onclick = () => { mem.set("no-installa", true); bannerInstalla(); };
}

/* disegno */
function disegna(){
  if (!dati){
    $("lista").innerHTML = `<div class="vuoto">${errore ? "Non riesco a leggere il programma. Controlla la connessione, riprovo tra poco." : "Caricamento del programma…"}</div>`;
    return;
  }
  const oggi = calcola(), t = adesso();
  if (!scelta || !dati.giorni.includes(scelta))
    scelta = dati.giorni.includes(oggi) ? oggi : (dati.giorni.includes(mem.get("giorno")) ? mem.get("giorno") : dati.giorni[0]);

  $("stato").textContent = (errore ? (ultimo ? `Senza connessione: dati delle ${hhmm(ultimo)}` : "Senza connessione")
    : SHEET_ID ? `Aggiornato alle ${hhmm(ultimo)}` : "Dati di prova: edizione 2025")
    + (scarto ? ` · simulazione del ${etichettaGiorno(oggi)} alle ${hhmm(t)}` : "");
  if (dati.giorni.length){
    const gg = dati.giorni.map(g => +g.slice(8)), mese = etichettaGiorno(dati.giorni[0], true).split(" ").pop();
    $("date").textContent = `Bari, ${gg.length > 1 ? gg.slice(0,-1).join(", ") + " e " + gg.at(-1) : gg[0]} ${mese} ${dati.giorni[0].slice(0,4)}`;
  }
  $("avviso").innerHTML = dati.avviso ? `<div class="avviso">${esc(dati.avviso)}</div>` : "";
  pannelloLive(oggi, t);

  const conta = [...preferiti].length;
  $("conta").hidden = !conta; $("conta").textContent = conta;
  document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === vista));

  $("barra").hidden = vista !== "prog";
  $("pdf").hidden = vista !== "prog" || !PDF_PROGRAMMA || !!cercato;
  if (PDF_PROGRAMMA) $("pdf").href = PDF_PROGRAMMA;
  if (vista === "prog"){
    $("schede").innerHTML = dati.giorni.map(g => `<button data-g="${g}" class="${scelta === g ? "on" : ""}">${esc(etichettaGiorno(g))}</button>`).join("");
    $("filtri").hidden = !!cercato || dati.sale.length < 2;
    $("filtri").innerHTML = [["", "Tutte le sale"], ...dati.sale.map(s => [s, nomeSala(s)])]
      .map(([v, n]) => `<button data-s="${esc(v)}" class="${filtro === v ? "on" : ""}">${esc(n)}</button>`).join("");
  }
  $("lista").innerHTML =
      vista === "mio" ? vistaMio(t)
    : vista === "poster" ? vistaPoster()
    : vista === "info" ? vistaInfo()
    : cercato.length >= 2 ? risultati(cercato, t) : elencoGiorno(scelta, t);

  if (scorriAdesso && vista === "prog" && $("adesso")) $("adesso").scrollIntoView({block:"center"});
  scorriAdesso = false;
}

/* comandi */
document.querySelector(".nav").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  vista = b.dataset.v; disegna(); window.scrollTo({top:0}); };
$("schede").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  scelta = b.dataset.g; mem.set("giorno", scelta); cercato = ""; $("q").value = ""; $("qx").hidden = true; disegna(); };
$("filtri").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  filtro = b.dataset.s; mem.set("sala", filtro); disegna(); };
$("q").oninput = e => { cercato = e.target.value.trim(); $("qx").hidden = !cercato; disegna(); };
$("qx").onclick = () => { $("q").value = ""; cercato = ""; $("qx").hidden = true; disegna(); $("q").focus(); };
$("lista").addEventListener("click", e => {
  const b = e.target.closest(".stella"); if (!b) return;
  const c = b.dataset.star; preferiti.has(c) ? preferiti.delete(c) : preferiti.add(c);
  mem.set("preferiti", [...preferiti]); disegna();
});
$("live").addEventListener("click", () => {});

$("piede").textContent = "Gli orari in corso seguono il programma e gli eventuali ritardi comunicati dagli organizzatori.";

/* funzionamento offline e installazione */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
bannerInstalla();

carica();
setInterval(() => carica(true), AGGIORNA_LIVE * 1000);
setInterval(() => carica(false), AGGIORNA_TUTTO * 60000);
setInterval(() => dati && disegna(), 30000);
</script>
